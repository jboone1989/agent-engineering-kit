name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  real-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . 'import-linter>=2,<3'
      - run: npm init -y && npm install --no-save --no-package-lock dependency-cruiser typescript
      - name: Real adapter pass/fail/pass regression
        env:
          AEGKIT_REQUIRE_ADAPTERS: '1'
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v

  package:
    runs-on: ubuntu-latest
    needs: [test, real-adapters]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
